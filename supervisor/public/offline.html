<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Grimport — Offline</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --panel: #ffffff;
      --line: #e2e2e6;
      --tx: #1d1d20;
      --tx2: #55555c;
      --vio: #7a5fc0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1d1d20;
        --panel: #24242a;
        --line: #34343c;
        --tx: #f2f0f6;
        --tx2: #a6a4b0;
        --vio: #a98af0;
      }
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--tx);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      padding-top: calc(24px + env(safe-area-inset-top));
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 32px 24px;
    }
    .card svg { color: var(--vio); }
    h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
    }
    p {
      font-size: 13px;
      line-height: 1.5;
      color: var(--tx2);
      margin: 0;
    }
    button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--tx);
      font-size: 13px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="40" height="40" fill="none" aria-hidden="true">
      <path fill-rule="evenodd" clip-rule="evenodd" fill="currentColor" d="M30 8c9 3 16 11 17 23l1 21c-6-6-11-4-16 6-5-10-10-12-16-6l1-21C18 19 23 11 30 8zm1.5 13c-6 2-9.5 7.5-9.5 14.5 0 7 4 11.5 9.5 13.5 5.5-2 9.5-6.5 9.5-13.5 0-7-3.5-12.5-9.5-14.5z"/>
      <path d="M24.5 34.5l6 2M38.5 34.5l-6 2" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
    <h1>You are offline</h1>
    <p>Grimport needs a connection to show live status.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
