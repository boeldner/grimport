<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Grimport — Offline</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/views.css" />
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1d20" media="(prefers-color-scheme: dark)">
</head>
<body class="auth-page">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <path fill-rule="evenodd" clip-rule="evenodd" fill="currentColor" d="M30 8c9 3 16 11 17 23l1 21c-6-6-11-4-16 6-5-10-10-12-16-6l1-21C18 19 23 11 30 8zm1.5 13c-6 2-9.5 7.5-9.5 14.5 0 7 4 11.5 9.5 13.5 5.5-2 9.5-6.5 9.5-13.5 0-7-3.5-12.5-9.5-14.5z"/>
          <path d="M24.5 34.5l6 2M38.5 34.5l-6 2" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
        <h1 class="auth-brand-name">You are offline</h1>
        <p class="auth-brand-sub">Grimport needs a connection to show live status.</p>
      </div>
      <button type="button" class="btn btn-primary" id="btn-retry">Try again</button>
    </div>
  </div>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('grimport-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
      document.getElementById('btn-retry').addEventListener('click', function () {
        // Served in place of a page by the service worker: reload that page.
        if (location.pathname === '/offline.html') location.href = '/'; else location.reload();
      });
    })();
  </script>
</body>
</html>
