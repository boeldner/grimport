<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Grimport — Sign in</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none'%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' fill='%238f83c4' d='M30 8c9 3 16 11 17 23l1 21c-6-6-11-4-16 6-5-10-10-12-16-6l1-21C18 19 23 11 30 8zm1.5 13c-6 2-9.5 7.5-9.5 14.5 0 7 4 11.5 9.5 13.5 5.5-2 9.5-6.5 9.5-13.5 0-7-3.5-12.5-9.5-14.5z'/%3E%3Cpath d='M24.5 34.5l6 2M38.5 34.5l-6 2' stroke='%23c9b7ff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1d20" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Grimport">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <style>
    html, body {
      height: 100%;
      background: var(--bg);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-wrap {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: var(--sp-5);
      padding: var(--sp-4);
    }

    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-2);
      text-align: center;
    }
    .login-brand svg { color: var(--vio); }
    .login-brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--tx);
    }
    .login-brand-sub {
      font-size: 13px;
      color: var(--tx2);
    }

    .login-card {
      background: var(--panel);
      border: 1px solid var(--line2);
      border-radius: var(--r-card);
      padding: var(--sp-5);
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.05),
        var(--shdw);
    }

    .login-card form { display: flex; flex-direction: column; gap: var(--sp-4); }
    .login-card .g-input { width: 100%; box-sizing: border-box; }
    .login-card .btn-primary { width: 100%; padding: 9px; font-size: 14px; margin-top: var(--sp-1); }

    .login-error {
      color: var(--err);
      font-size: 13px;
      line-height: 1.4;
      padding: 8px 11px;
      background: var(--errSoft);
      border: 1px solid rgba(208,52,44,0.3);
      border-radius: var(--r-control);
      display: none;
    }
    .login-error.visible { display: block; }

    .login-footer {
      text-align: center;
      font-size: 11px;
      color: var(--tx3);
    }

    .login-remember { margin-top: -4px; }
    .login-back-row { display: flex; justify-content: center; margin-top: -4px; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="36" height="36" fill="none" aria-hidden="true">
        <path fill-rule="evenodd" clip-rule="evenodd" fill="currentColor" d="M30 8c9 3 16 11 17 23l1 21c-6-6-11-4-16 6-5-10-10-12-16-6l1-21C18 19 23 11 30 8zm1.5 13c-6 2-9.5 7.5-9.5 14.5 0 7 4 11.5 9.5 13.5 5.5-2 9.5-6.5 9.5-13.5 0-7-3.5-12.5-9.5-14.5z"/>
        <path d="M24.5 34.5l6 2M38.5 34.5l-6 2" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="login-brand-name">Grimport</div>
        <div class="login-brand-sub">Your sites, on your server.</div>
      </div>
    </div>

    <div class="login-card">
      <form id="login-form">
        <div class="field">
          <label class="field-label" for="username-input">Username</label>
          <input type="text" name="username" id="username-input" class="g-input"
            autocomplete="username" required autofocus
            placeholder="admin" />
        </div>
        <div class="field">
          <label class="field-label" for="password-input">Password</label>
          <input type="password" name="password" id="password-input" class="g-input"
            autocomplete="current-password" required
            placeholder="Enter your password" />
        </div>
        <label class="g-toggle login-remember">
          <input type="checkbox" id="remember-input" name="remember" />
          <span class="g-toggle-track"></span>
          <span>Remember this device for 30 days</span>
        </label>
        <p class="login-error" id="login-error" role="alert"></p>
        <button type="submit" class="btn btn-primary" id="btn-login">Sign in</button>
      </form>

      <form id="totp-form" class="hidden">
        <div class="field">
          <label class="field-label" for="totp-code-input">Authenticator code</label>
          <input type="text" id="totp-code-input" name="code" class="g-input"
            inputmode="numeric" autocomplete="one-time-code"
            placeholder="123456 or a recovery code" required />
          <div class="field-help muted">Enter the 6-digit code from your app, or one of your recovery codes.</div>
        </div>
        <p class="login-error" id="totp-error" role="alert"></p>
        <button type="submit" class="btn btn-primary" id="btn-totp-verify">Verify</button>
        <div class="login-back-row">
          <button type="button" class="link-btn" id="btn-totp-back">Back to sign in</button>
        </div>
      </form>
    </div>

    <div class="login-footer" id="login-footer-version">Grimport · self-hosted</div>
  </div>

  <script>
    // After login, return to a same-origin page that sent us here (e.g. the
    // OAuth consent page). Only relative paths are accepted.
    function nextUrl() {
      var n = new URLSearchParams(location.search).get('next') || '';
      return (n.charAt(0) === '/' && n.charAt(1) !== '/' && n.charAt(1) !== '\\') ? n : '/';
    }
    fetch('/api/config').then(r => r.json()).then(d => {
      if (d.version) document.getElementById('login-footer-version').textContent = `Grimport v${d.version} · self-hosted`;
    }).catch(() => {});

    function showTotpStep() {
      document.getElementById('login-form').classList.add('hidden');
      document.getElementById('totp-form').classList.remove('hidden');
      document.getElementById('login-error').classList.remove('visible');
      document.getElementById('totp-code-input').value = '';
      document.getElementById('totp-code-input').focus();
    }

    function showLoginStep() {
      document.getElementById('totp-form').classList.add('hidden');
      document.getElementById('login-form').classList.remove('hidden');
      document.getElementById('totp-error').classList.remove('visible');
    }

    // A page reload mid-2FA (correct password already accepted, code not
    // yet entered) leaves a pending session — resume the code step instead
    // of re-asking for the password.
    fetch('/api/auth/me').then(r => r.json()).then(me => {
      if (me && me.totp_required) showTotpStep();
    }).catch(() => {});

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const err = document.getElementById('login-error');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      err.classList.remove('visible');
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username-input').value.trim(),
            password: document.getElementById('password-input').value,
            remember: document.getElementById('remember-input').checked,
          }),
        });
        const data = await res.json();
        if (res.ok && data.totp_required) {
          btn.disabled = false;
          btn.textContent = 'Sign in';
          showTotpStep();
        } else if (res.ok) {
          window.location.href = nextUrl();
        } else {
          if (res.status === 429) err.textContent = data.error || 'Too many failed logins';
          else err.textContent = data.error || 'Sign in failed';
          err.classList.add('visible');
          btn.disabled = false;
          btn.textContent = 'Sign in';
        }
      } catch {
        err.textContent = 'Network error — is the server running?';
        err.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });

    document.getElementById('totp-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-totp-verify');
      const err = document.getElementById('totp-error');
      btn.disabled = true;
      btn.textContent = 'Verifying…';
      err.classList.remove('visible');
      try {
        const res = await fetch('/api/auth/totp/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: document.getElementById('totp-code-input').value.trim() }),
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = nextUrl();
        } else {
          err.textContent = data.error || 'Invalid code';
          err.classList.add('visible');
          btn.disabled = false;
          btn.textContent = 'Verify';
        }
      } catch {
        err.textContent = 'Network error — is the server running?';
        err.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Verify';
      }
    });

    document.getElementById('btn-totp-back').addEventListener('click', async () => {
      try { await fetch('/api/auth/logout', { method: 'POST' }); } catch {}
      showLoginStep();
    });
  </script>
</body>
</html>
